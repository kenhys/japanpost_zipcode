name: Update data

on:
  schedule:
    # GitHub cron has no "last day of month", so run on 28-31 and
    # check the date in the job. 14:00 UTC is 23:00 JST.
    - cron: "0 14 28-31 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Tokyo
    steps:
      - name: Check last day of month
        id: check
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || \
             [ "$(date -d tomorrow +%d)" = "01" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v5
        if: steps.check.outputs.run == 'true'
      - name: Download data
        if: steps.check.outputs.run == 'true'
        run: python3 update.py > "$RUNNER_TEMP/commit-message.txt"
      - name: Commit
        if: steps.check.outputs.run == 'true'
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add README.md jigyosyo.zip ken_all.zip utf_ken_all.zip
          git commit -F "$RUNNER_TEMP/commit-message.txt"
          git push
